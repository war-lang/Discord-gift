<!DOCTYPE html>
<html>
<head>
  <title>gift free nitro🎁</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 70px;
    }

    /* Top title */
    .page-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 35px;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    /* Main card */
    .card {
      width: min(90%, 520px);
      padding: 45px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h2 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 25px;
      color: #f8fafc;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      background: #0f172a;
      border-radius: 12px;
      color: #cbd5e1;
      font-size: 16px;
      line-height: 2;
    }

    .label {
      color: #94a3b8;
    }

    .value {
      color: #f8fafc;
    }
  </style>
</head>

<body>

  <!-- Top of the page -->
  <div class="page-title">
    Discord.gg
  </div>

  <div class="card">

    <h2>Visitor Information</h2>

    <div class="subtitle">
      This is a official link from discord.gg 
    </div>

    <button id="lookupButton">
      gift the free nitro 🎁 
    </button>

    <div id="result"></div>

  </div>

  <script>
    document.getElementById("lookupButton").addEventListener("click", lookup);

    async function lookup() {
      const result = document.getElementById("result");

      result.innerHTML = "Loading information...";

      try {
        const response = await fetch("https://ipapi.co/json/");

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const data = await response.json();

        result.innerHTML =
          "<span class='label'>IP Address:</span> <span class='value'>" +
          (data.ip || "Unavailable") + "</span><br>" +

          "<span class='label'>City:</span> <span class='value'>" +
          (data.city || "Unavailable") + "</span><br>" +

          "<span class='label'>Region:</span> <span class='value'>" +
          (data.region || "Unavailable") + "</span><br>" +

          "<span class='label'>Country:</span> <span class='value'>" +
          (data.country_name || "Unavailable") + "</span><br>" +

          "<span class='label'>Postal Code:</span> <span class='value'>" +
          (data.postal || "Unavailable") + "</span>";

      } catch (error) {
        console.error(error);
        result.innerHTML = "Unable to load information.";
      }
    }
  </script>

</body>
</html>
