<!DOCTYPE html>
<html>
<head>
  <title>discord.gg</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 55px 20px;
    }

    .page-title {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 35px;
      letter-spacing: -0.5px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 42px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h2 {
      margin: 0;
      text-align: center;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 15px;
      margin: 12px 0 30px;
    }

    button {
      width: 100%;
      padding: 17px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 22px;
      background: #0f172a;
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 16px;
      line-height: 2;
    }

    .label {
      color: #94a3b8;
    }

    .value {
      color: #f8fafc;
      font-weight: 500;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 40px 16px;
      }

      .page-title {
        font-size: 30px;
        margin-bottom: 30px;
      }

      .card {
        padding: 30px 24px;
      }

      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="page-title">
    Vfree nitro
  </div>

  <div class="card">

    <h2>Visitor Information</h2>

    <div class="subtitle">
      this is a official link from discord.gg 
    </div>

    <button id="lookupButton">
      gift nitro🎁 
    </button>

    <div id="result"></div>

    <div class="footer">
      Information is provided by your public IP address.
    </div>

  </div>

  <script>
    document.getElementById("lookupButton").addEventListener("click", lookup);

    async function lookup() {
      const button = document.getElementById("lookupButton");
      const result = document.getElementById("result");

      button.disabled = true;
      button.textContent = "Loading...";
      result.style.display = "block";
      result.innerHTML = "Loading information...";

      try {
        const response = await fetch("https://ipapi.co/json/");

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const data = await response.json();

        result.innerHTML =
          "<span class='label'>IP Address:</span> <span class='value'>" +
          (data.ip || "Unavailable") + "</span><br>" +

          "<span class='label'>City:</span> <span class='value'>" +
          (data.city || "Unavailable") + "</span><br>" +

          "<span class='label'>Region:</span> <span class='value'>" +
          (data.region || "Unavailable") + "</span><br>" +

          "<span class='label'>Country:</span> <span class='value'>" +
          (data.country_name || "Unavailable") + "</span><br>" +

          "<span class='label'>Postal Code:</span> <span class='value'>" +
          (data.postal || "Unavailable") + "</span>";

        button.textContent = "Refresh Information";

      } catch (error) {
        console.error(error);

        result.innerHTML =
          "Unable to load information. Please try again.";

        button.textContent = "Try Again";
      }

      button.disabled = false;
    }
  </script>

</body>
</html>
