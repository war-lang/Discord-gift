<!DOCTYPE html>
<html>
<head>
  <title>Visitor Info</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 55px 20px;
    }

    .page-title {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 35px;
      letter-spacing: -0.5px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 42px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h2 {
      margin: 0;
      text-align: center;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 15px;
      margin: 12px 0 30px;
    }

    button {
      width: 100%;
      padding: 17px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 22px;
      background: #0f172a;
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 16px;
      line-height: 2;
    }

    .label {
      color: #94a3b8;
    }

    .value {
      color: #f8fafc;
      font-weight: 500;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 40px 16px;
      }

      .page-title {
        font-size: 30px;
        margin-bottom: 30px;
      }

      .card {
        padding: 30px 24px;
      }

      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
